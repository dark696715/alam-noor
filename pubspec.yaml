name: alam_noor
description: عالم نور - تطبيق تعليمي تفاعلي للأطفال من التحضيري إلى السنة الخامسة ابتدائي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  rive: ^0.13.4
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Storage & Data
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Media
  video_player: ^2.9.1
  chewie: ^1.8.1
  audioplayers: ^6.0.0
  just_audio: ^0.9.40

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  confetti: ^0.7.0
  percent_indicator: ^4.2.3

  # Firebase (optional - uncomment when ready)
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
